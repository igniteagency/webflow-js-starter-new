<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Button word splitting regression checks</title>
  <h1>Button word splitting regression checks</h1>
  <p>Serve the repository root after <code>bun run build</code> and open this page.</p>
  <pre id="results">Running…</pre>
  <div id="fixture">
    <a class="button_component" href="#destination">
      <p id="initial-label" data-el="button-word-label">Present before initialization</p>
    </a>
  </div>
  <script>
    window.Webflow = { push: (callback) => callback() };
  </script>
  <script src="../dist/prod/components/button-words.js"></script>
  <script type="module">
    const results = [];
    const fixture = document.querySelector('#fixture');
    const settle = () => new Promise((resolve) => setTimeout(resolve, 0));
    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
    };
    const makeLabel = (text, optIn = true) => {
      const button = document.createElement('a');
      button.className = 'button_component';
      button.href = '#destination';
      button.setAttribute('aria-label', 'Authored accessible name');
      const label = document.createElement('p');
      label.className = 'button_text';
      if (optIn) label.dataset.el = 'button-word-label';
      label.textContent = text;
      button.append(label);
      fixture.append(button);
      return label;
    };
    const test = async (name, callback) => {
      await callback();
      results.push(name);
    };
    try {
      await test('splits labels present before initialization', async () => {
        const label = document.querySelector('#initial-label');
        assert(label.querySelectorAll('.button_word').length === 3, 'Initial label was missed');
        assert(label.textContent === 'Present before initialization', 'Initial label changed');
      });
      await test('preserves whitespace, Unicode and literal markup without duplicate text', async () => {
        const text = '  Read\tstories\nfrom  boarders & families — <img src=x> 👩🏽‍🎓\u00a0KRB ';
        const label = makeLabel(text);
        await settle();
        assert(label.textContent === text, 'Original text changed');
        assert(!label.querySelector('img'), 'Text became HTML');
        assert(label.querySelectorAll('.button_word').length === 10, 'Unexpected word count');
        assert(
          [...label.querySelectorAll('.button_word')].every(
            (word) =>
              word.children.length === 1 && word.firstElementChild.matches('.button_word-text')
          ),
          'Invalid mask structure'
        );
        assert(!label.querySelector('[aria-hidden]'), 'Accessible text hidden');
        assert(
          label.parentElement.getAttribute('aria-label') === 'Authored accessible name',
          'Authored name changed'
        );
        assert(label.parentElement.getAttribute('href') === '#destination', 'Link changed');
      });
      await test('leaves unmarked labels and authored rich text untouched', async () => {
        const plain = makeLabel('No opt in', false);
        const rich = makeLabel('');
        const strong = document.createElement('strong');
        strong.textContent = 'Preserve emphasis';
        rich.append(strong);
        await settle();
        assert(!plain.children.length, 'Unmarked label split');
        assert(rich.firstElementChild === strong, 'Rich content replaced');
      });
      await test('reconciles replacement text, same text and edits inside an existing word', async () => {
        const label = makeLabel('Old copy');
        await settle();
        label.textContent = 'New  longer copy';
        await settle();
        assert(
          label.textContent === 'New  longer copy' &&
            label.querySelectorAll('.button_word').length === 3,
          'New copy not split'
        );
        label.textContent = 'New  longer copy';
        await settle();
        assert(
          label.querySelectorAll('.button_word').length === 3,
          'Same-text replacement not split'
        );
        label.querySelector('.button_word-text').firstChild.data = 'Edited first';
        await settle();
        assert(
          label.textContent === 'Edited first  longer copy' &&
            label.querySelectorAll('.button_word').length === 4,
          'Character-data edit not reconciled'
        );
        label.textContent = '';
        await settle();
        assert(!label.childNodes.length, 'Empty label has leftover markup');
      });
      await test('is stable through repeated initialization and its own mutation callbacks', async () => {
        const label = makeLabel('Repeat safely');
        await settle();
        const word = label.firstElementChild;
        const state = document[Symbol.for('webflow.button-words')];
        const script = document.createElement('script');
        script.src = '../dist/prod/components/button-words.js?repeat';
        await new Promise((resolve, reject) => {
          script.onload = resolve;
          script.onerror = reject;
          document.head.append(script);
        });
        await settle();
        assert(
          document[Symbol.for('webflow.button-words')] === state,
          'Duplicate observer installed'
        );
        assert(label.firstElementChild === word, 'Unchanged words replaced');
        assert(!label.querySelector('.button_word .button_word'), 'Nested duplicate masks');
        let changes = 0;
        const observer = new MutationObserver((records) => {
          changes += records.length;
        });
        observer.observe(label, { childList: true, subtree: true });
        await settle();
        await settle();
        observer.disconnect();
        assert(changes === 0, 'Mutation loop remains active');
      });
      window.buttonWordsTestResult = { passed: results.length, tests: results };
      document.querySelector('#results').textContent = JSON.stringify(
        window.buttonWordsTestResult,
        null,
        2
      );
    } catch (error) {
      window.buttonWordsTestResult = {
        passed: results.length,
        tests: results,
        error: String(error),
      };
      document.querySelector('#results').textContent = JSON.stringify(
        window.buttonWordsTestResult,
        null,
        2
      );
      throw error;
    }
  </script>
</html>
